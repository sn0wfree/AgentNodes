name = "DeepSeek Chat"
description = "DeepSeek chat model for instruction following, coding, and analysis"
family = "deepseek"
release_date = "2025-12-01"
last_updated = "2026-02-28"
attachment = true
reasoning = false
temperature = true
knowledge = "2025-09"
tool_call = true
open_weights = true

[cost]
input = 0.14
output = 0.28
cache_read = 0.0028

[limit]
context = 1_000_000
output = 384_000

[modalities]
input = ["text"]
output = ["text"]

# ── 渠道行为 ────────────────────────────────────────────────────────
# DeepSeek 系的思考走独立字段 reasoning_content（不是 content 内嵌标签）。
[channel]
thinking_fields = ["reasoning_content"]
stream_options = { include_usage = true }
# 思考 token 先于正文，max_tokens 预算需给两者都留余量
min_output_tokens = 4096
