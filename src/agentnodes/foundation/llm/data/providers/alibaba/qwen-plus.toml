name = "Qwen Plus"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
release_date = "2024-01-25"
last_updated = "2025-09-11"
attachment = false
reasoning = true
temperature = true
knowledge = "2024-04"
tool_call = true
open_weights = false

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "budget_tokens"

[cost]
input = 0.4
output = 1.2
reasoning = 4

[limit]
context = 1_000_000
output = 32_768

[modalities]
input = ["text"]
output = ["text"]

# ── 渠道行为 ────────────────────────────────────────────────────────
# Qwen（DashScope 兼容模式）的思考走 OpenAI 风格独立字段
# ``reasoning_content``；不用 content 内嵌标签。
[channel]
thinking_fields = ["reasoning_content"]
stream_options = { include_usage = true }
