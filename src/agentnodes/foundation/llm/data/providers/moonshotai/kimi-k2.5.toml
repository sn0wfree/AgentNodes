name = "Kimi K2.5"
description = "Earlier Kimi frontier model for long-context agents, coding, and multimodal work"
family = "kimi-k2"
release_date = "2026-01"
last_updated = "2026-01"
attachment = false
reasoning = true
structured_output = true
temperature = false
tool_call = true
knowledge = "2025-01"
open_weights = true

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[cost]
input = 0.6
output = 3.0
cache_read = 0.1

[limit]
context = 262_144
output = 262_144

[modalities]
input = ["text", "image", "video"]
output = ["text"]

# ── 渠道行为 ────────────────────────────────────────────────────────
# K2.5 的思考走独立字段 reasoning_content（同 [interleaved].field）。
# **注意**：改造前 kimi.py 硬编码"无原生思考支持"（两个 return None），
# 与本文件的 [interleaved].field 自相矛盾——配置驱动的第一件事就是把
# 这种漂移暴露出来。
[channel]
thinking_fields = ["reasoning_content"]
