name = "GPT-4o mini"
description = "Small omni GPT for cheap multimodal assistance and production-scale traffic"
family = "gpt-mini"
release_date = "2024-07-18"
last_updated = "2024-07-18"
attachment = true
reasoning = false
temperature = true
knowledge = "2023-09"
tool_call = true
structured_output = true
open_weights = false

[cost]
input = 0.15
output = 0.60
cache_read = 0.075

[limit]
context = 128_000
output = 16_384

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]

# ── 渠道行为 ────────────────────────────────────────────────────────
# OpenAI 的推理模型（o1/o3）走独立字段 ``reasoning``（不是
# ``reasoning_content``——那是 DeepSeek 系的叫法）。
[channel]
thinking_fields = ["reasoning"]
stream_options = { include_usage = true }
