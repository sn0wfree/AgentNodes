name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Ruff
        run: ruff check src

      - name: Pyright (regressions-gate)
        run: |
          python -m pip install pyright
          # cmd keeps the JSON output in UTF-8 (PowerShell redirects to UTF-16)
          python -m pyright --outputjson > pyright-report.json || true
          python scripts/pyright_regressions.py --report pyright-report.json

  unit:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Resolve shard ${{ matrix.shard }}
        id: shard
        run: |
          # time-aware mode: LPT pack by .shard-timings.json, falls back to
          # round-robin if the file is missing or empty.
          FILES=$(python scripts/pytest_shard.py \
            --mode time-aware --shard ${{ matrix.shard }} --shards 4)
          echo "count=$(echo "$FILES" | grep -c . || true)" >> "$GITHUB_OUTPUT"
          echo "$FILES" > /tmp/shard_files.txt
          head -5 /tmp/shard_files.txt

      - name: Run tests (shard ${{ matrix.shard }}/4)
        run: |
          if [ ! -s /tmp/shard_files.txt ]; then
            echo "empty shard, skip"
            exit 0
          fi
          # PR lane: llm/e2e/slow excluded (docs/test-marker-lanes-design.md).
          # push to main runs the FULL suite — merge has no feedback SLA.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m pytest $(tr '\n' ' ' < /tmp/shard_files.txt) \
              -q --tb=short --reruns=2 --reruns-delay=1 --durations=20 \
              -m "not llm and not e2e and not slow"
          else
            python -m pytest $(tr '\n' ' ' < /tmp/shard_files.txt) \
              -q --tb=short --reruns=2 --reruns-delay=1 --durations=20
          fi

      - name: Upload TUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-screenshots-py${{ matrix.python-version }}-s${{ matrix.shard }}
          path: tui-captures/
          retention-days: 14

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}-s${{ matrix.shard }}
          path: |
            .pytest_cache/v/cache/lastfailed
            .pytest_cache/v/cache/nodeids
          retention-days: 7
          if-no-files-found: ignore

  eval-sim:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Golden task sanity (no LLM)
        run: |
          python evals/run_evals.py
          python -m pytest tests/test_eval_scorecard.py -q --tb=short

  architecture-gates:
    # 结构门禁（scripts/arch/）。此前只由 scripts/batch_gate.cmd 手动跑，
    # CI 完全不调用 —— 2026-11-14 的红线（kernel/algo 51 处业务名词）因此
    # 潜伏 2 天：全量 pytest 一直绿，因为当时没有任何用例扫 kernel 名词。
    # 本 job 补齐「违反时会红」的自动化防线；pytest 侧另有
    # tests/test_scripts_arch.py 的同名断言作为第二道网。
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Layer direction (dangling imports)
        run: python scripts/arch/check_dangling_imports.py --layers

      - name: Path literals
        run: python scripts/arch/check_path_literals.py

      - name: Capability requires
        run: python scripts/arch/check_capability_requires.py

      - name: Semantic placement
        run: python scripts/arch/check_semantics_placement.py

      - name: Tool references
        run: python scripts/arch/check_tool_refs.py

      - name: Kernel business nouns
        run: python scripts/arch/check_kernel_nouns.py

      - name: Env access (settings read layer)
        run: python scripts/arch/check_env_access.py

      - name: Architecture diagram drift
        run: python scripts/arch/sync_architecture_diagram.py

      - name: Framework doc numbers (v1.2)
        run: python scripts/arch/check_framework_numbers.py
