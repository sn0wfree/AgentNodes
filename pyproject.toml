[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentnodes"
version = "0.7.0"
# 项目定位（2026-11-05）：可自我进化的 Agent 框架。
# 批次 9 已完成包名重命名：strategy_research -> agentnodes。
description = "可自我进化的 Agent 框架 — 四层单向依赖 + 能力端口化 + RSI 闭环"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AgentNodes Team"}]
keywords = ["agent", "harness", "llm", "orchestration", "capability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "httpx>=0.27",          # OpenAI-compatible LLM client (PR5)
    "prompt-toolkit>=3.0",  # REPL input layer (Phase A)
    "textual>=0.50",        # Full-screen Textual TUI (Phase B v0.4.0)
    "markdownify>=0.13",    # HTML → Markdown (Phase 2: Web I/O)
    "duckduckgo-search>=7.0",  # Free web search, no API key (Phase 2: Web I/O)
    "tomli>=2.0; python_version<'3.11'",  # TOML parser for Python <3.11 (model_catalog)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",        # asyncio_mode=auto 需要此插件，否则 async 测试从不执行
    "pytest-timeout>=2.1",         # [tool.pytest.ini_options].timeout 需要此插件
    "pytest-cov>=4.0",
    "pytest-rerunfailures>=12.0",  # CI: retry flaky tests so偶发不阻塞门禁
    "pytest-split>=0.9",           # CI: 时间感知分片（读取 .shard-timings.json）
    "ruff>=0.4",
]
llm = [
    "python-dotenv>=1.0",   # Auto-load .env into OPENAI_API_KEY (optional)
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]
engine = [
    "pydantic>=2.5",
    "QuantOPT>=0.1.1",
]
langgraph = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]
webui = [
]
webui-api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
]

[project.scripts]
# 批次 9b：CLI 名统一为 agentnodes。
# 旧名（quantnodes-research / quantnodes-strategy-research）已移除——
# 安装后只有 agentnodes 一个入口，避免同名覆盖与文档歧义。
agentnodes = "agentnodes.interfaces.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentnodes = ["templates/**/*", "templates/.prompts/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Honor @pytest.mark.xdist_group markers via loadgroup distribution so
# same-group tests land on the same worker (avoids parallel pollution
# e.g. test_workflow_segment_loop — see tech-debt ⑥).
#
# 本地全量加速（2026-11-03）：`pytest tests -n 4 --dist loadgroup`
# 串行全量约 30–45 分钟，4 worker 约 8–12 分钟。不加到 addopts 里，
# 因为 CI 分片已按 .shard-timings.json 均衡，重复并行反而抢 CPU。
addopts = ["-ra"]
xfail_strict = true
# A1 (2026-10-28): global backstop so one pathological test can never
# hang a whole run again (the PR lane used to block forever on a stale
# 1800s approval wait). Suites needing longer override per-test with
# @pytest.mark.timeout.
timeout = 180
# Lane markers (docs/test-marker-lanes-design.md §2); applied by
# tests/conftest.py pytest_collection_modifyitems via a file whitelist.
markers = [
    "llm: needs a real LLM or live network (excluded from PR gate)",
    "e2e: end-to-end across process/browser boundaries (excluded from PR gate)",
    "slow: >=~5s wall time per .shard-timings.json (excluded from PR gate)",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# testcase/ holds frozen golden snapshots of code that was removed from the
# package during the AgentNodes split. They are reference material, not
# maintained source — never lint or format them.
extend-exclude = ["testcase"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "C90"]
ignore = ["E501", "E741", "E402"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# 2026-11-05 批次 9：以下三条曾指向已删目录（alpha_zoo / data_source /
# study/_archived），随减法批次 1/3/5 一起失效，已清理。
# 保留的是仍需豁免的真实路径：
# One-shot history migration script (zero external references) — not
# worth decomposing.
"src/agentnodes/scripts/migrate_study_history.py" = ["C901"]
# Golden snapshots of code removed during the AgentNodes split — reference
# material only. Never lint them (they carry stale imports of the business
# package and were never formatted to this repo's rules).
"testcase/**" = [
    "ALL",
]

[tool.ruff.lint.isort]
known-first-party = ["agentnodes"]
