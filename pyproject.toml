[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantnodes-strategy-research"
version = "0.6.0"
description = "通用策略自动研究框架 — Karpathy autoresearch 极简 + 多 Agent 增强 + Rich CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "QuantNodes Team"}]
keywords = ["quantitative", "research", "strategy", "factor", "backtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "httpx>=0.27",          # OpenAI-compatible LLM client (PR5)
    "prompt-toolkit>=3.0",  # REPL input layer (Phase A)
    "textual>=0.50",        # Full-screen Textual TUI (Phase B v0.4.0)
    "markdownify>=0.13",    # HTML → Markdown (Phase 2: Web I/O)
    "duckduckgo-search>=7.0",  # Free web search, no API key (Phase 2: Web I/O)
    "tomli>=2.0; python_version<'3.11'",  # TOML parser for Python <3.11 (model_catalog)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-rerunfailures>=12.0",  # CI: retry flaky tests so偶发不阻塞门禁
    "pytest-split>=0.9",           # CI: 时间感知分片（读取 .shard-timings.json）
    "ruff>=0.4",
]
llm = [
    "python-dotenv>=1.0",   # Auto-load .env into OPENAI_API_KEY (optional)
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]
engine = [
    "pydantic>=2.5",
    "QuantOPT>=0.1.1",
]
langgraph = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]
webui = [
]
webui-api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
]

[project.scripts]
quantnodes-research = "strategy_research.interfaces.cli.__main__:main"
quantnodes-strategy-research = "strategy_research.interfaces.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strategy_research = ["templates/**/*", "templates/.prompts/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Honor @pytest.mark.xdist_group markers via loadgroup distribution so
# same-group tests land on the same worker (avoids parallel pollution
# e.g. test_workflow_segment_loop — see tech-debt ⑥).
#
# 本地全量加速（2026-11-03）：`pytest tests -n 4 --dist loadgroup`
# 串行全量约 30–45 分钟，4 worker 约 8–12 分钟。不加到 addopts 里，
# 因为 CI 分片已按 .shard-timings.json 均衡，重复并行反而抢 CPU。
addopts = ["-ra"]
xfail_strict = true
# A1 (2026-10-28): global backstop so one pathological test can never
# hang a whole run again (the PR lane used to block forever on a stale
# 1800s approval wait). Suites needing longer override per-test with
# @pytest.mark.timeout.
timeout = 180
# Lane markers (docs/test-marker-lanes-design.md §2); applied by
# tests/conftest.py pytest_collection_modifyitems via a file whitelist.
markers = [
    "llm: needs a real LLM or live network (excluded from PR gate)",
    "e2e: end-to-end across process/browser boundaries (excluded from PR gate)",
    "slow: >=~5s wall time per .shard-timings.json (excluded from PR gate)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "C90"]
ignore = ["E501", "E741", "E402"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/strategy_research/core/alpha_zoo/**" = ["F401"]
"src/strategy_research/core/data_source/**" = ["F401"]
# Archived study code kept for reference only — never fix its lint.
"src/strategy_research/core/study/_archived/**" = ["C901", "F401", "E9"]
# One-shot history migration script (zero external references) — not
# worth decomposing (docs/p2-c901-final-design.md §1).
"src/strategy_research/scripts/migrate_study_history.py" = ["C901"]

[tool.ruff.lint.isort]
known-first-party = ["strategy_research"]
