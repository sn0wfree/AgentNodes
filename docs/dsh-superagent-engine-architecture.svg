<svg viewBox="0 0 1180 880" width="1180" height="880" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .ttl{font-size:19px;font-weight:600;fill:#0f172a}
    .sec{font-size:14px;font-weight:600;fill:#334155}
    .bt{font-size:14px;font-weight:600;fill:#0f172a}
    .st{font-size:12.5px;fill:#475569}
    .sm{font-size:11.5px;fill:#94a3b8}
    .lbl{font-size:11px;fill:#0369a1}
    .box{fill:#fff;stroke:#cbd5e1;stroke-width:1}
    .boxb{fill:#e0f2fe;stroke:#7dd3fc;stroke-width:1.2}
    .boxa{fill:#fef3c7;stroke:#fcd34d;stroke-width:1.2}
    .boxg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}
    .boxd{fill:none;stroke:#334155;stroke-width:1.4;stroke-dasharray:7 5}
    .fl{stroke:#0ea5e9;stroke-width:1.4;fill:none;marker-end:url(#a1)}
    .fld{stroke:#94a3b8;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#a3)}
  </style>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="none" stroke="#0ea5e9" stroke-width="1.4"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1.3"/></marker>
  </defs>

  <text x="40" y="34" class="ttl">dsh-superagent：Engine 五部分与 Ticket 状态机</text>
  <text x="40" y="56" class="sm">依据 deepseek-ai/dsh-superagent-prototype @ 6337fc8（2026-10-31）· 逐条对照代码核实</text>

  <!-- ================= Engine ================= -->
  <text x="40" y="92" class="sec">① Engine：唯一写入者 · 方法全同步 · 每条命令一个事务</text>

  <rect x="40" y="106" width="778" height="216" rx="10" class="boxd"/>
  <text x="54" y="126" class="sm" style="font-weight:600">副作用一律先入队（Effects），事务提交后才执行；part 依赖单向，不可反向</text>

  <rect x="72" y="142" width="148" height="46" rx="7" class="boxb"/>
  <text x="146" y="163" class="bt" text-anchor="middle">Intake</text>
  <text x="146" y="179" class="sm" text-anchor="middle">receive · 扇出到订阅</text>

  <rect x="252" y="142" width="148" height="46" rx="7" class="boxb"/>
  <text x="326" y="163" class="bt" text-anchor="middle">Evals</text>
  <text x="326" y="179" class="sm" text-anchor="middle">批处理 · 闸门 · 决定</text>

  <rect x="432" y="142" width="148" height="46" rx="7" class="boxb"/>
  <text x="506" y="163" class="bt" text-anchor="middle">Tickets</text>
  <text x="506" y="179" class="sm" text-anchor="middle">生命周期 · 订阅 · Inputs</text>

  <rect x="612" y="142" width="148" height="46" rx="7" class="boxb"/>
  <text x="686" y="163" class="bt" text-anchor="middle">Assignments</text>
  <text x="686" y="179" class="sm" text-anchor="middle">executor 回报与报告</text>

  <rect x="432" y="248" width="116" height="46" rx="7" class="box"/>
  <text x="490" y="269" class="bt" text-anchor="middle">Replies</text>
  <text x="490" y="285" class="sm" text-anchor="middle">按规则写 Channel</text>

  <line x1="220" y1="165" x2="248" y2="165" class="fl"/>
  <line x1="400" y1="165" x2="428" y2="165" class="fl"/>
  <line x1="580" y1="165" x2="608" y2="165" class="fl"/>

  <line x1="506" y1="188" x2="506" y2="244" class="fl"/>
  <text x="514" y="220" class="lbl">reply / withdraw</text>

  <path d="M 686 188 L 686 232 L 600 232 L 600 192" class="fld"/>
  <text x="612" y="226" class="sm">report 回写</text>

  <rect x="852" y="142" width="184" height="52" rx="7" class="boxa"/>
  <text x="944" y="164" class="bt" text-anchor="middle">DshExecutor</text>
  <text x="944" y="182" class="sm" text-anchor="middle">worker-&lt;ticket&gt; · 一单一目录</text>
  <line x1="760" y1="165" x2="848" y2="165" class="fl"/>
  <text x="772" y="157" class="lbl">launch</text>

  <rect x="852" y="248" width="184" height="46" rx="7" class="box"/>
  <text x="944" y="269" class="bt" text-anchor="middle">Outbox → Channel</text>
  <text x="944" y="285" class="sm" text-anchor="middle">回执 · 重试 · 幂等去重</text>
  <line x1="580" y1="271" x2="848" y2="271" class="fl"/>

  <text x="54" y="272" class="sm">依赖方向：</text>
  <text x="54" y="292" class="sm">Replies 无依赖 ← Tickets ← Assignments</text>
  <text x="54" y="310" class="sm">Evals → Tickets　·　Intake → Tickets</text>

  <!-- ================= Ticket 状态机 ================= -->
  <text x="40" y="368" class="sec">② Ticket 状态机：stage 由「在等谁」推导（ticketStage），非被动设置；自上而下首个匹配生效</text>

  <rect x="120" y="392" width="190" height="42" rx="7" class="boxg"/>
  <text x="215" y="418" class="bt" text-anchor="middle">Decision = accept</text>

  <rect x="120" y="458" width="190" height="44" rx="7" class="box"/>
  <text x="215" y="478" class="bt" text-anchor="middle">working / queued</text>
  <text x="215" y="494" class="sm" text-anchor="middle">无 Assignment 或 pending</text>

  <rect x="120" y="530" width="190" height="44" rx="7" class="box"/>
  <text x="215" y="550" class="bt" text-anchor="middle">working</text>
  <text x="215" y="566" class="sm" text-anchor="middle">turn 进行中</text>

  <rect x="120" y="602" width="190" height="44" rx="7" class="box"/>
  <text x="215" y="622" class="bt" text-anchor="middle">idle</text>
  <text x="215" y="638" class="sm" text-anchor="middle">report=waiting 或 Assignment 结束</text>

  <rect x="136" y="712" width="158" height="58" rx="7" class="boxb"/>
  <text x="215" y="738" class="bt" text-anchor="middle">ended</text>
  <text x="215" y="756" class="sm" text-anchor="middle">completed · merged · closed</text>

  <line x1="215" y1="434" x2="215" y2="454" class="fl"/>
  <line x1="215" y1="502" x2="215" y2="526" class="fl"/>
  <line x1="215" y1="574" x2="215" y2="598" class="fl"/>
  <text x="223" y="590" class="lbl">turn 结束</text>

  <!-- 订阅 Thread 新 Trigger：左回环，标签竖排在 x=96 -->
  <path d="M 120 624 L 96 624 L 96 552 L 116 552" class="fld"/>
  <text x="88" y="590" class="sm" transform="rotate(-90 88 590)" text-anchor="middle">订阅 Thread 的新 Trigger</text>

  <!-- 人消息 + 复验：更外侧回环，标签竖排在 x=48 -->
  <path d="M 120 741 L 48 741 L 48 480 L 116 480" class="fld"/>
  <text x="38" y="614" class="sm" transform="rotate(-90 38 614)" text-anchor="middle">人的消息 + Mandate 复验</text>

  <!-- person 组 -->
  <rect x="588" y="492" width="392" height="196" rx="10" class="boxa"/>
  <text x="604" y="518" class="bt">person/* — 卡在人，必须由人推进</text>
  <text x="604" y="546" class="st">delivery　· 输入投递失败（2s 起翻倍重试）</text>
  <text x="604" y="570" class="st">answer　· 有 attention 未回答</text>
  <text x="604" y="594" class="st">review　· 最新 report = ready</text>
  <text x="604" y="618" class="st">blocked / failed　· 且此后无人的消息</text>
  <text x="604" y="648" class="sm">以上即优先级顺序，越靠上越优先</text>
  <text x="604" y="668" class="sm">既投递失败又有 ready 的工单显示为「输入未投递」</text>

  <path d="M 310 550 L 584 550" class="fl" style="marker-end:none"/>
  <path d="M 584 550 L 312 550" class="fld"/>
  <text x="336" y="542" class="lbl">任一阶段可进入</text>
  <text x="358" y="568" class="sm">人的消息或 retry 解除</text>

  <path d="M 310 552 L 362 552 L 362 741 L 298 741" class="fl"/>
  <text x="372" y="733" class="sm">ready（无已跟随 PR）→ completed　·　dropped → dropped</text>

  <path d="M 784 688 L 784 800 L 215 800 L 215 774" class="fl"/>
  <text x="370" y="816" class="sm">PR 合并 / 关闭 · 人工 stop（撤回 Mandate）</text>

  <text x="40" y="860" class="sm">虚线 = 由外部事件或人触发；实线 = 正常推进。ended 后只有「人的消息 + Mandate 复验通过」能回到 queued，是唯一复活路径</text>
</svg>
