  <rect x="676" y="20" width="250" height="66" rx="9" class="box"/><text x="692" y="44" class="bt">WebUI</text><text x="692" y="64" class="st">SSE 时间线</text>
  <rect x="939" y="20" width="250" height="66" rx="9" class="box"/><text x="955" y="44" class="bt">MCP</text><text x="955" y="64" class="st">对外工具协议</text>
  <text x="150" y="106" class="sm">哑适配器：只构造 WorkRequest + 订阅事件流 ✅ chat/schedule/CLI 已接 · MCP 无 chat 出口（N/A）</text>
  <line x1="275" y1="112" x2="275" y2="124" class="arb"/><line x1="538" y1="112" x2="538" y2="124" class="arb"/><line x1="801" y1="112" x2="801" y2="124" class="arb"/><line x1="1064" y1="112" x2="1064" y2="124" class="arb"/>
  <line x1="275" y1="124" x2="1064" y2="124" stroke="#0ea5e9"/>
  <line x1="560" y1="124" x2="560" y2="146" class="arb"/>
  <text x="620" y="140" class="flow-lbl">WorkRequest（一份契约）—— 全部汇入 Gateway，不直达研究域</text>
  <rect x="138" y="132" width="648" height="1084" rx="12" class="boxd" style="fill:none"/>
  <text x="146" y="146" class="sm" style="font-weight:600">平台脊（业务无关 · kernel）—— 研究域是右翼并列，不是底座</text>
  <text x="40" y="180" class="lyr">② Gateway</text>
  <rect x="150" y="150" width="620" height="510" rx="10" class="boxb"/>
  <text x="166" y="176" class="hub">Gateway ✅（单进程 · 唯一控制面）—— submit/receipt · cancel · recover(fold)</text>
  <text x="166" y="196" class="hq">收下即进 mailbox · 事实经事件流 · 回执两态 · 内部同层自由互调</text>
  <rect x="166" y="214" width="588" height="36" rx="6" class="boxg"/>
  <text x="180" y="236" class="st">协议端点 ✅（薄 · 无状态 · kernel）：契约校验 · 幂等去重 · 转发 mailbox ｜ 独立宿主 ⏳</text>
  <rect x="166" y="258" width="286" height="96" rx="8" class="box"/>
  <text x="182" y="280" class="bt">mailbox ✅ · kernel</text>
  <text x="182" y="300" class="st">lane 串行 · cap 20 溢出摘要</text>
  <text x="182" y="320" class="st">steer · 老化 · interrupt ✅</text>
  <rect x="470" y="258" width="284" height="96" rx="8" class="box"/>
  <text x="486" y="280" class="bt">SessionController ✅</text>
  <text x="486" y="300" class="st">turn 准入 · P-4 身份 · fence</text>
  <text x="486" y="320" class="st">4 队列模式 · 消费者常驻</text>
  <rect x="166" y="362" width="286" height="96" rx="8" class="box"/>
  <text x="182" y="384" class="bt">Director ✅ · apps ⚠</text>
  <text x="182" y="404" class="st">停因→动作 · study.directive</text>
  <text x="182" y="424" class="sm">物理 core/study/ · runner 轮末调用 · 不读预算</text>
  <rect x="470" y="362" width="284" height="96" rx="8" class="box"/>
  <text x="486" y="384" class="bt">ModelHub ✅ · kernel</text>
  <text x="486" y="404" class="st">provider/model 解析唯一入口</text>
  <text x="486" y="424" class="sm">未知 provider 拒绝 · 限流 ⏳</text>
  <rect x="166" y="470" width="286" height="96" rx="8" class="box"/>
  <text x="182" y="492" class="bt">ContextHub ✅ · kernel</text>
  <text x="182" y="512" class="st">collect→arbitrate→render 独占</text>
  <text x="182" y="532" class="sm">预算仲裁 · 压缩同源 · Provider 3/4</text>
  <rect x="470" y="470" width="284" height="96" rx="8" class="box"/>
  <text x="486" y="492" class="bt">EventStore ✅ · Scheduler ⏳</text>
  <text x="486" y="512" class="st">emit/subscribe/replay 唯一事实源</text>
  <text x="486" y="532" class="sm">永久保留 · PROTOCOL_VERSION ✅</text>
  <rect x="166" y="574" width="588" height="36" rx="6" class="boxd"/>
  <text x="180" y="596" class="st">容量组闸 ⏳（闸不是队 · 等待在 mailbox）· kernel</text>
  <rect x="166" y="618" width="588" height="36" rx="6" class="box"/>
  <text x="180" y="640" class="st">RunContext（per-run 约束：budget/cancel/steer/trace）· kernel · 包对象 ⏹</text>
  <rect x="150" y="672" width="300" height="48" rx="8" class="boxb"/>
  <text x="166" y="692" class="bt">ConfigHub ✅ · kernel</text>
  <text x="166" y="710" class="st">分层装载 · fail-fast · 敏感隔离</text>
  <rect x="470" y="672" width="300" height="48" rx="8" class="boxd"/>
  <text x="486" y="692" class="bt">CapabilityRegistry ⏳ · kernel</text>
  <text x="486" y="710" class="st">resolve(kind) 供给端口回调 · G2b</text>
  <line x1="772" y1="690" x2="854" y2="690" class="arpu"/>
  <text x="813" y="680" font-size="11" fill="#7c3aed" text-anchor="middle" font-family="monospace">端口回调</text>
  <line x1="854" y1="712" x2="772" y2="712" class="arb"/>
  <text x="813" y="730" font-size="11" fill="#0369a1" text-anchor="middle" font-family="monospace">服务白名单</text>
  <text x="40" y="756" class="lyr">③ 执行面</text>
  <rect x="150" y="760" width="620" height="56" rx="9" class="boxa"/>
  <text x="166" y="782" class="bt">GraphEngine ✅（包裹 langgraph · 唯一 runtime）</text>
  <text x="166" y="804" class="st">chat/study/fanout 原生 · swarm/workflow 编译器 ✅ ｜ T1 协程 ✅ · T2 池 ✅ · T3 ⏳</text>
  <rect x="150" y="828" width="300" height="88" rx="9" class="box"/>
  <text x="166" y="850" class="bt">节点类型（每阶段开关 ReAct）</text>
  <text x="166" y="870" class="st">llm ✅ · react ✅（=AgentLoop 平移）</text>
  <text x="166" y="890" class="sm">cpu ⏹ · graph ⏹（R5）</text>
  <rect x="470" y="828" width="300" height="88" rx="9" class="box"/>
  <text x="486" y="850" class="bt">Preset 注册表（图 = 纯数据）</text>
  <text x="486" y="870" class="st">chat=退化图 ✅ · research=方法论图 ✅</text>
  <text x="486" y="890" class="sm">Tier0 冻结 ⏹ · D2 提案通道 ⏳</text>
  <rect x="150" y="928" width="620" height="40" rx="9" class="box"/>
  <text x="166" y="952" class="st">执行红线：图根 = turn 走 mailbox ✅ · 取消连坐 ✅ · fence 挂根 ✅ · 事件带 run_id ✅</text>
  <text x="40" y="1000" class="lyr">④ 平台数据</text>
  <text x="150" y="992" class="st" style="font-weight:600">P-1…P-5 · kernel 事件语义（存储原语在 ⑥ foundation）</text>
  <rect x="150" y="1004" width="300" height="72" rx="9" class="box"/>
  <text x="166" y="1026" class="bt">事实流（P-1）✅</text>
  <text x="166" y="1046" class="st">event_log · emit/replay · 永久保留</text>
  <rect x="470" y="1004" width="300" height="72" rx="9" class="box"/>
  <text x="486" y="1026" class="bt">状态库（P-2）✅</text>
  <text x="486" y="1046" class="st">统一库 · projector 折叠 · sqlite 在 ⑥</text>
  <rect x="150" y="1088" width="300" height="72" rx="9" class="box"/>
  <text x="166" y="1110" class="bt">工件登记（P-3）✅</text>
  <text x="166" y="1130" class="st">&gt;64KB 落盘+登记 · 事件只带指针</text>
  <rect x="470" y="1088" width="300" height="72" rx="9" class="box"/>
  <text x="486" y="1110" class="bt">身份 + 指针（P-4/5）✅</text>
  <text x="486" y="1130" class="st">派生 id · 四件套 · sha256 校验</text>
  <rect x="150" y="1172" width="620" height="36" rx="8" class="boxa"/>
  <text x="166" y="1194" class="st">接缝规则：研究域不许私开存储通道 —— 大产物走登记 · 事实走事件流 · id 挂血统</text>
  <text x="826" y="144" class="lyr">⑤ 研究域（工作翼 · apps）</text>
