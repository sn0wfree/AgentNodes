  <rect x="166" y="214" width="688" height="36" rx="6" class="boxg"/>
  <text x="182" y="236" class="st">协议端点 ✅（薄 · 无状态 · kernel）：契约校验 · 幂等去重 · 转发 mailbox ｜ 独立宿主 ⏳</text>
