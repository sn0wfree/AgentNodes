  <text x="858" y="258" class="sm">假设→证伪→AEGIS→journal · method/ 归位（D1）</text>
  <rect x="842" y="320" width="331" height="56" rx="9" class="box"/>
  <text x="858" y="340" class="bt">执行组件</text>
  <text x="858" y="358" class="sm">runner · scheduler · director（apps ⚠）</text>
  <rect x="842" y="420" width="331" height="56" rx="9" class="box"/>
  <text x="858" y="440" class="bt">研究账本</text>
  <text x="858" y="458" class="sm">hypothesis · claims · journal · study</text>
  <rect x="842" y="520" width="331" height="56" rx="9" class="box"/>
  <text x="858" y="540" class="bt">市场数据 ✅</text>
  <text x="858" y="558" class="sm">market.duckdb · 接入专写（D-3）</text>
  <rect x="842" y="620" width="331" height="56" rx="9" class="box"/>
  <text x="858" y="640" class="bt">回测 + rounds ✅</text>
  <text x="858" y="658" class="sm">studies/{id}/rounds（D-4）· P-5 指针</text>
  <rect x="842" y="720" width="331" height="56" rx="9" class="box"/>
  <text x="858" y="740" class="bt">数据工具 ✅</text>
  <text x="858" y="758" class="sm">core/tools · data_clean / transforms</text>
  <text x="842" y="800" class="sm">编号阶梯 → ⑦ · 体量速览 → 右栏（本翼只放业务组件）</text>
  <text x="1260" y="168" class="lyr">台账（右栏）</text>
  <rect x="1260" y="180" width="300" height="110" rx="10" class="box"/>
  <text x="1276" y="206" class="bt">InvariantLayer · 底线 ✅</text>
  <text x="1276" y="230" class="st">预算 · 停止 · 状态机 · scope</text>
  <text x="1276" y="250" class="st">✅ 6 条不变量 + verify_all()</text>
  <text x="1276" y="270" class="sm">独立于插件 · 不可被覆盖</text>
  <rect x="1260" y="310" width="300" height="150" rx="10" class="box"/>
  <text x="1276" y="336" class="bt">质量门禁 ✅</text>
  <text x="1276" y="360" class="st">✅ 架构门禁 ×16 + 依赖总表棘轮</text>
  <text x="1276" y="380" class="st">✅ 接缝门禁（9 触点白名单）</text>
  <text x="1276" y="400" class="st">✅ method/ 门禁 · ✅ AST 无环</text>
  <text x="1276" y="420" class="st">✅ cov_gate A/B/C ≥90 + 双基线门</text>
  <text x="1276" y="440" class="sm">全绿基线见 delivery-summary §17</text>
  <rect x="1260" y="480" width="300" height="190" rx="10" class="boxg"/>
  <text x="1276" y="506" class="bt">落地状态（11-03）</text>
  <text x="1276" y="530" class="st">✅ E1 契约/mailbox · 控制器 · 不变量</text>
  <text x="1276" y="550" class="st">✅ R1-R7+B1-B3：fence/steer/老化/域</text>
  <text x="1276" y="570" class="st">✅ 执行面单一引擎 · 恢复原语统一</text>
  <text x="1276" y="590" class="st">✅ 入口唯一 · ContextHub 独占</text>
  <text x="1276" y="610" class="st">✅ 数据面 · ModelHub · Director</text>
  <text x="1276" y="630" class="st">✅ 四层骨架门禁（基线 107）</text>
  <text x="1276" y="654" class="sm">⏳ 容量组闸 · 独立宿主 · 分库 · Sched 唯一</text>
  <rect x="1260" y="690" width="300" height="360" rx="10" class="boxg"/>
  <text x="1276" y="716" class="bt">成员与体量速览（11-03 审计）</text>
  <text x="1276" y="740" class="st">apps：22 包 · 57.6k 行（全库 43%）</text>
  <text x="1276" y="762" class="sm">study 10.9k · alpha_zoo 25.7k · goal 6.1k</text>
  <text x="1276" y="782" class="sm">engine 2.4k · data_source 2.1k</text>
  <text x="1276" y="802" class="sm">hypothesis 1.5k · compute_factor 1.4k</text>
  <text x="1276" y="822" class="sm">autoresearch 1.4k · db 1.3k</text>
  <text x="1276" y="842" class="sm">strategy_acceptance 1.0k · 其余 ~4k</text>
  <text x="1276" y="868" class="st">kernel：35.7k —— 三子带</text>
  <text x="1276" y="890" class="sm">控制面 4.1k（②）· 执行面 6.0k（③）</text>
  <text x="1276" y="910" class="sm">能力面 24.6k：agent 22k 独大</text>
  <text x="1276" y="930" class="sm">context/hooks/permission/memory/skills</text>
  <text x="1276" y="956" class="st">interfaces：29.5k（api 15.2k · cli 13.3k）</text>
  <text x="1276" y="978" class="st">foundation：10.8k（8% · llmwikify 11% 同级）</text>
  <text x="1276" y="1004" class="sm">口径：AST import 扫描；行数含空行注释；</text>
  <text x="1276" y="1024" class="sm">scripts/templates 不计入门禁。</text>
  <line x1="430" y1="1216" x2="430" y2="1230" class="arb"/>
  <line x1="1000" y1="1216" x2="1000" y2="1230" class="arb"/>
  <text x="40" y="1262" class="lyr">⑥ foundation（L4 · 共同底座）</text>
  <rect x="150" y="1230" width="1039" height="68" rx="9" class="box"/>
  <text x="166" y="1252" class="bt">llm · storage · registry · observability · utils · web · config_loader · errors · git</text>
  <text x="166" y="1274" class="st">零业务知识 · 被脊翼共同依赖（L4→任何 = 0 ✅）· 晋升门槛 = 去 run/session 语义可独立成库</text>
  <rect x="150" y="1314" width="520" height="110" rx="10" class="boxg"/>
  <text x="166" y="1336" class="bt">接缝规范（唯一接缝叙事）</text>
  <text x="166" y="1358" class="st">L1 窄协议 ✅ · L2 统一注册 ⏳（→ CapabilityRegistry/G2b）· L3 一致性套件 ⏳</text>
  <text x="166" y="1378" class="st">hook 红线 ✅ 只读不改控制流 · PROTOCOL_VERSION ✅ R4</text>
  <text x="166" y="1398" class="st">脊→翼单向 · 9 触点白名单 · 门禁强制 ✅</text>
  <rect x="690" y="1314" width="499" height="110" rx="10" class="boxa"/>
  <text x="706" y="1336" class="bt">基因组（RSI）· 只改行为工件</text>
  <text x="706" y="1358" class="st">Tier 0 冻结 · Tier 1 提案制 · Tier 2 可自改</text>
  <text x="706" y="1378" class="st">先决条件：holdout 集（现缺）+ 不变量层 ✅</text>
  <text x="40" y="1474" class="lyr">⑦ 依赖总表与门禁（编号所在处 · 与 test_layer_matrix 同源）</text>
  <rect x="150" y="1484" width="560" height="270" rx="9" class="boxg"/>
  <text x="166" y="1506" class="st" style="font-weight:600">依赖 DAG（G2b 清零后 · 括号=当前边数）</text>
  <rect x="180" y="1522" width="150" height="34" rx="6" class="boxb"/><text x="192" y="1544" class="st" font-weight="600">L1 interfaces</text>
  <line x1="255" y1="1556" x2="255" y2="1574" class="arb"/>
  <rect x="180" y="1574" width="150" height="34" rx="6" class="boxw"/><text x="192" y="1596" class="st" font-weight="600">L2 apps</text>
  <line x1="255" y1="1608" x2="255" y2="1626" class="arb"/>
  <rect x="180" y="1626" width="150" height="34" rx="6" class="box"/><text x="192" y="1648" class="st" font-weight="600">L3 kernel</text>
  <line x1="255" y1="1660" x2="255" y2="1678" class="arb"/>
  <rect x="180" y="1678" width="150" height="34" rx="6" class="box"/><text x="192" y="1700" class="st" font-weight="600">L4 foundation</text>
  <text x="352" y="1544" class="st mono">L1→L2 315 · L1→L3 193 · L1→L4 77</text>
  <text x="352" y="1596" class="st mono">L2→L3 66（9 触点白名单）· L2→L4 129</text>
  <text x="352" y="1648" class="st mono">L3→L4 108</text>
  <text x="352" y="1700" class="st mono" fill="#dc2626">L3→L2 92 ⚠ G2b 反转清零中</text>
  <text x="166" y="1734" class="sm">编号 = DAG 拓扑排名（唯一与接缝规则自洽：kernel 不得 import apps）；</text>
  <text x="166" y="1750" class="sm">管线（上方脊-翼）= 运行时旅程，两轴正交——唯一向上的是端口回调。</text>
  <rect x="730" y="1484" width="459" height="150" rx="9" class="boxg"/>
  <text x="746" y="1506" class="st" style="font-weight:600">跨层 import 矩阵（2026-11-03 AST · 门禁复算一致）</text>
  <text x="746" y="1528" class="st mono">      →L1    →L2    →L3    →L4</text>
  <text x="746" y="1548" class="st mono">L1  1402    315    193     77</text>
  <text x="746" y="1568" class="st mono">L2     2   6673     66    129</text>
  <text x="746" y="1588" class="st mono">L3     3  <tspan fill="#dc2626">92⚠</tspan>   1449    108</text>
  <text x="746" y="1608" class="st mono">L4     0    <tspan fill="#dc2626">4⚠</tspan>   <tspan fill="#dc2626">6⚠</tspan>    338</text>
